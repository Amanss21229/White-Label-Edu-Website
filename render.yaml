services:
  - type: web
    name: white-label-registration-management
    runtime: node
    plan: starter
    buildCommand: cd FCFPSL-main && npm ci && npm run build && cd .. && python -m pip install -r SLManagement-main/requirements.txt
    startCommand: node start-production.js
    healthCheckPath: /api/brand
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: BRAND_NAME
        value: "Your Institute"
      - key: BRAND_TAGLINE
        value: "Learning for every student"
      - key: BRAND_LOGO_URL
        value: "/branding/logo.png"
      - key: BRAND_PRIMARY_COLOR
        value: "#D4AF37"
      - key: BRAND_CONTACT_PHONE
        value: ""
      - key: BRAND_CONTACT_ADDRESS
        value: ""
      - key: BRAND_LOCATION_QR_URL
        value: ""
      - key: BRAND_LOCATION_MAPS_URL
        value: ""
      - key: PROGRAM_NAME
        value: "Student Registration Program"

      - key: BRAND_WHATSAPP_URL
        value: ""
      - key: BRAND_YOUTUBE_URL
        value: ""
      - key: BRAND_INSTAGRAM_URL
        value: ""
      - key: BRAND_TELEGRAM_URL
        value: ""
      - key: BRAND_HERO_MEDIA
        value: "[]"
